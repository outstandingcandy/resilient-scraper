[project]
name = "resilient-scraper"
version = "0.3.0"
description = "Browser-based web scraper with resilient anti-detection capabilities"
requires-python = ">=3.11"
dependencies = [
    "DrissionPage>=4.0.0",
    "boto3>=1.28.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0.0"]
service = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
]
all = [
    "sqlalchemy>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
scraper-api = "resilient_scraper.service.api:main"
scraper-worker = "resilient_scraper.service.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_scraper"]
