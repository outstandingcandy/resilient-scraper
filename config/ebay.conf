# eBay seller storefront scraping configuration
#
# Lines with key=value set payload parameters for all tasks.
# Other non-empty, non-comment lines are seller slugs to scrape.
#
# Supported payload keys:
#   skip_existing — skip listing_ids already in DB (default: true)
#   max_pages     — max pages per seller, 72 items/page (default: 50)

skip_existing=true
max_pages=50

# Sellers (slug from URL: ebay.com/str/<slug>)
villagediecast
