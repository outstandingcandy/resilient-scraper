# Xiaohongshu scraping configuration
#
# Lines with key=value set payload parameters for all tasks.
# Other non-empty, non-comment lines are user IDs to scrape.
#
# Supported payload keys:
#   skip_existing_notes — false = rescrape all notes (default: true)
#   skip_existing_days  — skip notes scraped within N days, 0 = skip all existing (default: 0)
#   max_notes           — max notes per user, 0 = unlimited (default: 0)
#   scrape_mode         — "notes" | "following" | "search" (default: notes)

skip_existing_notes=false

# Authors (user ID or user ID # comment). Fill with real XHS user IDs;
# committing them here means they're visible to anyone who can read this
# repo, so treat this file as documentation of format and keep the real
# target list in a gitignored local copy (e.g. config/xhs.conf.local).
# EXAMPLE_XHS_USER_ID_1
# EXAMPLE_XHS_USER_ID_2
